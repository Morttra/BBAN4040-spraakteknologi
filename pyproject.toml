# Package metadata and dependencies; install with `pip install -e .` so scripts and notebooks can import norrag.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "norrag"
version = "0.1.0"
description = "Gemma 3 vs Borealis vs RAG over Norwegian Wikipedia on NRK-Quiz-QA (BBAN4040, NTNU)."
requires-python = ">=3.12"
# The exact versions the results were produced with (Python 3.12.15, 14 November 2026)
dependencies = [
    "pandas==3.0.6",
    "numpy==2.5.4",
    "pyarrow==26.0.0",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.4",
    "tqdm==4.70.1",
    "datasets==5.1.0",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "bm25s==0.3.13",
    "PyStemmer==3.1.0",
    "sentence-transformers==6.1.0",
    "torch==2.14.1",
    "transformers==5.19.0",
    "accelerate==1.15.0",
    "huggingface-hub==1.33.0",
    "openai==3.31.0",
    "anthropic==2.6.0",
    "openpyxl==3.1.5",
    "matplotlib==3.11.2",
    "jupyter==1.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]
