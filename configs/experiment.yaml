# Central experiment settings (models, retrievers, chunking, k values, paths and seeds) read by both scripts and notebooks.
# Change settings here, not in the code. Lines marked DECISION are choices the group has not made yet.

seed: 42

data:
  languages: [nb]                     # Bokmål only: Nynorsk and Northern Sámi are not used
  nrk_quiz: ltg/nrk_quiz_qa           # Hugging Face dataset id
  nrk_quiz_revision: v2.0             # pinned version: 3,516 Bokmål questions (4,790 with Nynorsk)
  wikipedia_urls:                     # Wikimedia Enterprise HTML dump of 20 March 2025, articles only
    nb: https://dumps.wikimedia.org/other/enterprise_html/runs/20250320/nowiki-NS0-20250320-ENTERPRISE-HTML.json.tar.gz

chunking:
  max_words: 100          # DECISION: chunk size in words
  overlap_words: 20      # DECISION: words shared by neighbouring chunks
  add_title: true          # DECISION: start every chunk with the article title (true/false)

retrieval:
  query_mode: full         # the whole question text (other modes: last_sentence, with_options)
  top_n: 20                # chunks saved per question in the run files
  retrievers: [bm25, dense]       # BM25 chosen over TF-IDF (see docs/decisions.md)
  bm25_k1: 1.5             # BM25 settings: the usual defaults
  bm25_b: 0.75
  dense_model: NbAiLab/nb-sbert-v2-base   # reads up to 512 tokens (nb-sbert-base only 75)
  dense_batch_size: 16     # texts embedded at once; 16 was fastest on the M1 Max GPU (about 180 chunks/s)

qa:
  k: 5                     # retrieved chunks in the prompt; same as annotation.pool_k, so the hand labels cover them
  scoring: option_letter   # score the option letter (NorEval p3): the model sees all options, one token per option
  prompt_template: noreval_p3   # name of a template in src/norrag/prompts.py: NorEval's p3, with our instruction before it
  chat_template: true      # the prompt as a user message, "Svar:" as the start of the model's reply; with the instruction,
                           # 93-100 % of the probability lands on the letters (Gemma with dense chunks: 89.8 %), and with
                           # chunks plain text did not get there (format check on 50 questions, 2026-11-06 and 2026-11-07)
  # 12B only. Main comparison: borealis-12b without retrieval vs gemma-12b with the retriever chosen
  # in the retrieval evaluation (BM25 or sentence-BERT); gemma-12b without retrieval is a reference.
  models:                  # revision: the exact commit hash on Hugging Face (models.model_revision), pinned 2026-11-05
    gemma-12b:    {id: google/gemma-3-12b-it, revision: 96b6f1eccf38110c56df3a15bffe176da04bfd80}
    borealis-12b: {id: NbAiLab/borealis-12b,  revision: 4c935c063adebe914df662c6ce22c1cb5de1a9fe}

annotation:
  n_questions: 50          # questions in the hand-labelled sample: about 9 chunks each, so about 460 pairs per annotator
  seed: 2026               # own seed: with 42, 46 of the 50 were the questions from the format check, which we had seen
  pool_k: 5                # top-k chunks from each retriever pooled for labelling
  annotators: [m, n]       # one blind sheet per person

judge:
  provider: anthropic      # anthropic or openai; the key goes in .env (ANTHROPIC_API_KEY or OPENAI_API_KEY)
  model: claude-sonnet-5-5 # not a Gemma model, so it does not judge its own family; chosen 2026-11-07
                           # (no temperature setting: newer models reject it; every reply is logged instead)

demo:
  n_questions: 20
  retriever: bm25
  models:
    gemma:    {id: google/gemma-3-270m-it, revision: ac82b4e820549b854eebf28ce6dedaf9fdfa17b3}
    borealis: {id: NbAiLab/borealis-270m,  revision: 3d89ebd0b86906bfe669591e29beaf000476a8b7}

paths:
  data_raw: data/raw
  data_processed: data/processed
  indexes: data/indexes
  results_raw: results/raw
  tables: results/tables
  figures: results/figures
  annotations: annotations
  demo_data: demo/data
